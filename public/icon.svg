    <linearGradient id="monogramGrad" x1="128" y1="360" x2="388" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ecff" />
      <stop offset="48%" stop-color="#9fead4" />
      <stop offset="100%" stop-color="#47dca0" />
