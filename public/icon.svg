      <stop offset="0%" stop-color="#111e36" />
      <stop offset="55%" stop-color="#091120" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="56%" cy="38%" r="54%">
